name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck entrypoint.sh detect-ups.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: usb-ups-server:ci
      - name: Smoke test (no UPS attached — must fail cleanly, not hang)
        run: |
          out=$(docker run --rm --name ci-ups usb-ups-server:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "UPS driver failed to start"
